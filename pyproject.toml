[project]
name = "parkflow-analytics"
version = "0.1.0"
description = "Queue time, visitor flow and weather intelligence for theme park operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Petrus" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
