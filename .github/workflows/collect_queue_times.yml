name: Collect queue-time snapshot

on:
  workflow_dispatch:
    inputs:
      force_outside_hours:
        description: "Collect even outside nominal operating hours"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rebuild_processed:
        description: "Rebuild processed queue dataset after collecting"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # GitHub cron schedules use UTC.
    # 13:07-23:52 UTC roughly covers 10:07-20:52 America/Sao_Paulo.
    # The collector also has an operating-hours guard, so off-hours runs skip safely.
    - cron: "7,22,37,52 13-23 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect one snapshot
        shell: bash
        run: |
          args=()

          if [[ "${{ github.event.inputs.force_outside_hours || 'false' }}" == "true" ]]; then
            args+=("--force-outside-hours")
          fi

          if [[ "${{ github.event.inputs.rebuild_processed || 'false' }}" == "true" ]]; then
            args+=("--rebuild-processed")
          fi

          python -m parkflow.data.collect_once "${args[@]}"

      - name: Upload raw snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: queue-time-raw-snapshot-${{ github.run_id }}
          path: data/raw/queue_times/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload processed dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: queue-time-processed-${{ github.run_id }}
          path: data/processed/queue_times.csv
          if-no-files-found: ignore
          retention-days: 14
